name: Publish

on:
  # Fire ONLY when release-please creates a GitHub release (which creates the tag).
  # This ensures npm publish and the GH release tag are always created together —
  # eliminating the drift that occurred when package.json was bumped in a feature
  # commit (PR #11) and publish.yml fired immediately while the release-please PR
  # (#8) was never merged, leaving npm at 1.1.0 with no v1.1.0 GH release tag.
  #
  # Flow: feature merges → release-please opens release PR → Kevin merges release
  # PR → release-please creates GH release + tag → this workflow fires → npm publish.
  #
  # If you ever need to publish without a GH release (emergency), use workflow_dispatch.
  release:
    types: [published]
  workflow_dispatch:

# Tests run in ci.yml on every push to main; this workflow only handles
# the npm publish step (gated separately so a publish failure doesn't
# masquerade as a test failure, and so PRs aren't blocked on a workflow
# that by definition can't run pre-merge).
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # enables npm --provenance via OIDC

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
