# Fleet secret-scan caller (Rule #363 — repo files never carry credential values).
# Delegates to the reusable workflow in studio-b-ai/ops-pipeline: gitleaks over
# the working tree on every PR and every push to main. Config = a repo-root
# .gitleaks.toml if present, else the canonical fleet rules. To ignore a
# fingerprint, add `<file>:<rule-id>:<line>` to a repo-root .gitleaksignore
# with a reason comment. Rollout + ladder: ops-pipeline#129.
name: secret-scan
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gitleaks:
    uses: studio-b-ai/ops-pipeline/.github/workflows/secret-scan.yml@main
